<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سایت من</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta property="og:title" content="سایت من">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=lalezar:400">
<style>
  :root{ --primary:#00ff00; --site-font:'لاله‌زار','Vazirmatn','Segoe UI',Tahoma,sans-serif; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--site-font); background:#fff; color:#181818; line-height:1.7; }
  a{ color:inherit; }
  .navbar{ display:flex; justify-content:space-between; align-items:center; padding:18px 8%; border-bottom:1px solid #eee; flex-wrap:wrap; gap:10px; }
  .navbar .nb-logo{ font-weight:800; font-size:17px; }
  .navbar .nb-links{ display:flex; gap:20px; }
  .navbar .nb-links a{ text-decoration:none; font-size:13.5px; color:#444; }
  .hero{ padding:90px 8% 70px; text-align:center; background:linear-gradient(160deg, var(--primary) 0%, #0000 60%), #101418; color:#fff; }
  .hero h1{ font-size:38px; font-weight:800; line-height:1.4; }
  .hero p{ margin-top:16px; font-size:15px; opacity:.85; max-width:520px; margin-inline:auto; }
  .hero-ctas{ display:flex; gap:12px; justify-content:center; margin-top:26px; flex-wrap:wrap; }
  .cta, .btn-solid{ display:inline-block; padding:13px 30px; border-radius:10px; background:var(--primary); color:#04140F; font-weight:800; font-size:14px; text-decoration:none; }
  .cta-ghost, .btn-outline{ display:inline-block; padding:13px 30px; border-radius:10px; border:1.5px solid rgba(255,255,255,.5); color:inherit; font-weight:700; font-size:14px; text-decoration:none; }
  .text-block{ padding:50px 8%; max-width:820px; margin-inline:auto; }
  .text-block h2{ font-size:23px; font-weight:800; margin-bottom:12px; }
  .text-block p{ font-size:14.5px; color:#555; }
  .image-block{ padding:20px 8%; text-align:center; }
  .image-block img{ max-width:100%; border-radius:14px; }
  .image-block .cap{ margin-top:10px; font-size:12px; color:#888; }
  .gallery-block{ padding:20px 8%; }
  .gallery-block .gal-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .gallery-block img{ width:100%; height:180px; object-fit:cover; border-radius:12px; }
  .button-block{ padding:36px 8%; text-align:center; }
  .cta-banner-block{ padding:70px 8%; text-align:center; background:var(--primary); color:#04140F; }
  .cta-banner-block h2{ font-size:26px; font-weight:800; margin-bottom:12px; }
  .cta-banner-block p{ opacity:.85; margin-bottom:22px; }
  .cta-white{ display:inline-block; padding:13px 30px; border-radius:10px; background:#fff; color:#111; font-weight:800; text-decoration:none; }
  .features-block{ padding:50px 8%; max-width:1000px; margin-inline:auto; }
  .features-block h2{ font-size:22px; font-weight:800; text-align:center; margin-bottom:24px; }
  .grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  .grid3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; }
  .fi{ background:#f7f7f7; border-radius:14px; padding:22px; }
  .fi h4{ font-size:15px; margin-bottom:8px; } .fi p{ font-size:12.5px; color:#777; }
  .stats-block{ display:flex; flex-wrap:wrap; justify-content:center; gap:40px; padding:50px 8%; background:#101418; color:#fff; }
  .stats-block .st{ text-align:center; } .stats-block b{ display:block; font-size:26px; color:var(--primary); }
  .stats-block span{ font-size:11.5px; opacity:.7; }
  .testimonials-block{ padding:50px 8%; max-width:900px; margin-inline:auto; }
  .tm{ background:#f7f7f7; border-radius:14px; padding:22px; }
  .tm p{ font-size:13.5px; color:#333; margin-bottom:14px; }
  .tm-name{ font-weight:700; font-size:13px; } .tm-role{ font-size:11px; color:#888; }
  .pricing-block{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; padding:50px 8%; max-width:1000px; margin-inline:auto; }
  .pr{ border:1px solid #eee; border-radius:16px; padding:26px; text-align:center; }
  .pr-name{ font-weight:700; font-size:14px; color:#888; } .pr-price{ font-size:26px; font-weight:800; margin:10px 0; }
  .pr ul{ list-style:none; font-size:12.5px; color:#555; margin:16px 0; text-align:right; }
  .pr ul li{ padding:5px 0; } .pr-cta{ display:inline-block; margin-top:10px; padding:10px 22px; border-radius:8px; background:var(--primary); color:#04140F; font-weight:800; text-decoration:none; font-size:13px; }
  .faq-block{ padding:50px 8%; max-width:720px; margin-inline:auto; }
  .faq-block details{ border-bottom:1px solid #eee; padding:14px 0; }
  .faq-block summary{ cursor:pointer; font-weight:700; font-size:14px; }
  .faq-block p{ margin-top:10px; font-size:13px; color:#666; }
  .team-block{ padding:50px 8%; max-width:1000px; margin-inline:auto; }
  .tmm{ text-align:center; } .tmm img, .tmm-placeholder{ width:100px; height:100px; border-radius:50%; object-fit:cover; background:#eee; margin:0 auto 12px; }
  .tmm-name{ font-weight:700; font-size:13.5px; } .tmm-role{ font-size:11px; color:#888; }
  .video-block{ padding:30px 8%; text-align:center; }
  .video-block video, .video-block iframe{ max-width:100%; width:100%; max-width:800px; aspect-ratio:16/9; border-radius:14px; border:none; }
  .social-block{ display:flex; justify-content:center; gap:12px; padding:30px 8%; flex-wrap:wrap; }
  .social-block a{ padding:9px 18px; border-radius:999px; background:#f2f2f2; font-size:12.5px; text-decoration:none; }
  .newsletter-block{ padding:60px 8%; text-align:center; background:#f7f7f7; }
  .newsletter-block h2{ font-size:22px; font-weight:800; margin-bottom:10px; }
  .newsletter-block form{ display:flex; gap:8px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
  .newsletter-block input{ padding:12px 16px; border-radius:10px; border:1px solid #ddd; font-size:13px; min-width:220px; }
  .newsletter-block button{ padding:12px 22px; border-radius:10px; border:none; background:var(--primary); color:#04140F; font-weight:800; font-size:13px; cursor:pointer; }
  .map-block{ padding:20px 8%; text-align:center; }
  .map-block iframe{ width:100%; max-width:800px; height:320px; border-radius:14px; }
  .map-address{ margin-top:10px; font-size:12.5px; color:#777; }
  hr{ border:none; border-top:1px solid #eee; margin:10px 8%; }
  .spacer-small{ height:24px; } .spacer-medium{ height:56px; } .spacer-large{ height:110px; }
  footer{ padding:36px 8%; text-align:center; background:#101418; color:#aaa; font-size:12.5px; }
  .logos-block{ padding:44px 8%; text-align:center; }
  .logos-block h2{ font-size:16px; font-weight:700; color:#888; margin-bottom:24px; }
  .logos-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:36px; }
  .logos-row img{ max-height:36px; max-width:120px; object-fit:contain; filter:grayscale(1); opacity:.75; }
  .timeline-block{ padding:50px 8%; max-width:820px; margin-inline:auto; }
  .timeline-block h2{ font-size:22px; font-weight:800; text-align:center; margin-bottom:26px; }
  .tl-grid{ display:flex; flex-direction:column; gap:14px; }
  .tl-step{ display:flex; gap:16px; align-items:flex-start; background:#f7f7f7; border-radius:14px; padding:18px 20px; }
  .tl-step-num{ width:32px; height:32px; border-radius:9px; background:var(--primary); color:#04140F; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex:none; }
  .tl-step h4{ font-size:14px; margin-bottom:4px; } .tl-step p{ font-size:12.5px; color:#666; }
  .countdown-block{ padding:60px 8%; text-align:center; background:#101418; color:#fff; }
  .countdown-block h2{ font-size:22px; font-weight:800; margin-bottom:22px; }
  .cd-timer{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .cd-box{ background:rgba(255,255,255,.06); border-radius:14px; padding:16px 18px; min-width:70px; }
  .cd-box span{ display:block; font-size:26px; font-weight:800; color:var(--primary); }
  .cd-box small{ font-size:10.5px; opacity:.7; }
  .countdown-block p{ margin-top:20px; opacity:.75; font-size:12.5px; }
</style>
</head>
<body>
<nav class="navbar"><span class="nb-logo">slime mc</span><div class="nb-links"><a href="#">خانه</a><a href="#">درباره</a><a href="#">تماس</a></div></nav>
<section class="hero"><h1>عنوان اصلی سایت شما</h1><p>یک توضیح کوتاه و جذاب درباره‌ی کسب‌وکار یا پروژه‌ات بنویس.</p><div class="hero-ctas"><a class="cta" href="#">شروع کن</a><a class="cta-ghost" href="#">بیشتر بدان</a></div></section>
<hr>
<section class="button-block"><a class="btn-solid" href="#">دانلود تی لانچر</a></section>

</body>
</html>
